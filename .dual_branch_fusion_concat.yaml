data_root: chest_xray
metadata_output_path: outputs/metadata/metadata.csv
analysis_output_dir: outputs/data_analysis
preprocessed_output_root: outputs/preprocessed/chest_xray_grayscale
preprocessed_metadata_output_path: outputs/preprocessed/preprocessed_metadata.csv
preprocessing:
  grayscale: true
  resize:
    enabled: true
    size:
    - 128
    - 128
data_augmentation:
  enabled: true
  probability: 0.5
  rotation_degrees: 10
  translate_pixels: 3
  noise_std: 0.02
  brightness_delta: 0.1
logistic_regression:
  data_augmentation:
    enabled: true
  output_dir: ./outputs/logistic_regression
  experiment_name: logistic_regression
  max_iter: 1000
  class_weight: balanced
  pca_n_components:
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  random_state: 42
  solver: lbfgs
  regularization_strength:
  - 0.1
  - 1.0
  - 10.0
deep_learning:
  output_dir: ./outputs/deep_learning
  experiment_name: dual_branch_baseline
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 1e-4
  noise_dropout_rate: 0.4
  random_state: 42
  fusion_type: concat
