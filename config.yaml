data_root: ../input-switchdrive
metadata_output_path: ./outputs/metadata/metadata.csv
analysis_output_dir: ./outputs/data_analysis
preprocessed_output_root: ./outputs/preprocessed/chest_xray_224
preprocessed_metadata_output_path: ./outputs/preprocessed/preprocessed_metadata_224.csv

preprocessing:
  grayscale: false
  resize:
    enabled: true
    size: [224, 224]

data_augmentation:
  enabled: true
  probability: 0.5
  rotation_degrees: 10
  translate_pixels: 3
  noise_std: 0.02
  brightness_delta: 0.10

logistic_regression:
  data_augmentation:
    enabled: true    
  output_dir: ./outputs/logistic_regression
  experiment_name: logistic_regression
  max_iter: 1000
  class_weight: balanced
  pca_n_components: [0.80, 0.85, 0.90, 0.95]
  random_state: 42
  solver: lbfgs
  regularization_strength: [0.1, 1.0, 10.0]

deep_learning:
  output_dir: ./outputs/deep_learning
  experiment_name: dual_branch_baseline
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 1e-4
  noise_dropout_rate: 0.4
  random_state: 42

cnn:
  data_augmentation:
    enabled: true
  random_state: 42
  output_dir: ./outputs/cnn
  experiment_name: densenet121_baseline
  model_name: densenet121
  pretrained: true
  num_classes: 3
  image_size: 128
  batch_size: 16
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  use_class_weights: true
  freeze_backbone: false
  num_workers: 2

vit:
  output_dir: ./outputs/vit
  experiment_name: vit_224_rgb_tuned
  model_name: vit_tiny_patch16_224
  pretrained: true
  num_classes: 3
  image_size: 224
  batch_size: 32
  epochs: 20
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_epochs: 3
  freeze_backbone: false
  unfreeze_at_epoch: 5
  use_class_weights: true
  dropout: 0.2
  label_smoothing: 0.1
  use_tta: true
  num_workers: 2
  preserve_aspect_ratio: false