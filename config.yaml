data_root: ../input-switchdrive
metadata_output_path: ./outputs/metadata/metadata.csv
analysis_output_dir: ./outputs/data_analysis
preprocessed_output_root: ./outputs/preprocessed/chest_xray_224
preprocessed_metadata_output_path: ./outputs/preprocessed/preprocessed_metadata_224.csv

preprocessing:
  grayscale: false
  resize:
    enabled: true
    size: [224, 224]

data_augmentation:
  enabled: true
  probability: 0.5
  rotation_degrees: 10
  translate_pixels: 3
  noise_std: 0.02
  brightness_delta: 0.10

logistic_regression:
  data_augmentation:
    enabled: true    
  output_dir: ./outputs/logistic_regression
  experiment_name: logistic_regression
  max_iter: 5000
  class_weight: balanced
  pca_n_components: [0.80, 0.85, 0.90, 0.95]
  random_state: 42
  solver: lbfgs
  regularization_strength: [0.1, 1.0, 10.0]


cnn:
  data_augmentation:
    enabled: true
  random_state: 42
  output_dir: ./outputs/cnn
  experiment_name: densenet121_baseline
  model_name: densenet121
  pretrained: true
  num_classes: 3
  image_size: 224
  batch_size: 16
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  use_class_weights: true
  freeze_backbone: false
  num_workers: 2

vit:
  output_dir: ./outputs/vit
  experiment_name: vit_224_rgb_final
  model_name: vit_tiny_patch16_224
  pretrained: true
  num_classes: 3
  image_size: 224
  batch_size: 32
  epochs: 20
  lr: 5.0e-5
  weight_decay: 0.001
  warmup_epochs: 3
  freeze_backbone: false
  use_class_weights: true
  dropout: 0.1
  label_smoothing: 0.1
  use_tta: true
  num_workers: 2
  preserve_aspect_ratio: false


dual_conv_vit:
  output_dir: ./outputs/dual_conv_vit
  experiment_name: dual_conv_vit_baseline
  num_classes: 3
  batch_size: 32
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  noise_dropout_rates: 0.4
  fusion_types: [concat, attention]
  label_smoothing: 0.0
  random_state: 42
  num_workers: 4
  freeze_epochs: 5

  # Optimal overrides from hyperparameter sweep
  concat:
    learning_rate: 5.0e-5
    noise_dropout_rates: 0.2
  attention:
    learning_rate: 1.0e-5
    noise_dropout_rates: 0.2
